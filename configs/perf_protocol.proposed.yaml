# PyPTO-X 性能测量协议（机器可读草案 v1）
#
# 状态：PROPOSED —— 尚未冻结，等待用户批准。
# 本文件只冻结「怎么测」，不冻结「测到多少」。
# 本阶段明确不设置任何绝对数值门槛；configs/model_targets.yaml:84 的
# performance_threshold_policy: defer-until-first-runnable-backends 保持不变。
#
# 配套文档：report.zh-CN.md（同目录）
# 生成任务：qwen35-perf-threshold-protocol
# 依据基线：port/pypto-x-integration @ bcf9516e6419d232338988238ffa8f79e59079c1

version: 1
status: proposed
frozen: false
supersedes: null

# ---------------------------------------------------------------------------
# 0. 元协议
# ---------------------------------------------------------------------------
meta:
  artifact_kind: pypto-x.perf-protocol
  language: zh-CN
  authority:
    - docs/LOCAL_RESOURCE_POLICY.zh-CN.md
    - docs/RESOURCE_MATRIX.zh-CN.md
    - /home/chiro/projects/.resource-locks/README.md
  absolute_thresholds_enabled: false
  rationale_absolute_thresholds_disabled:
    - 本机是 KVM guest 且无 cpufreq（/sys/devices/system/cpu/cpu0/cpufreq 不存在）→ 频率不可锁
    - 所有后端当前均为 op-by-op 逐 op 派发，无融合路径
    - "CUDA 侧 cuEvent 计时已实现（2026-09-11，W8B B3a），但 GamePC WSL2 平台存在 wsl2_cuevent_rate_offset：
       raw cuEvent 比 wall/第三方时钟系统性偏低 4.4–9.1% 且 run 间漂移，故 kernel/wall 一致性不能作为平台无关门禁"
    - 5080 WSL 无 libcublas / libcudart（ldconfig 实测为空）
    - 鲲鹏 920B 是 2 vCPU KVM guest，不得作门槛

# ---------------------------------------------------------------------------
# 1. 测量对象分层
# ---------------------------------------------------------------------------
levels:
  L0_op:
    description: 算子级 microbench，直接构造 Artifact + LaunchRequest，绕开图遍历
    driver_requirement: 必须直接调用 backend runtime，不得经 build_qwen35_text_decoder_graph
    must_report: [kernel_seconds, dispatch_seconds, wall_seconds, peak_rss_mib]
    shape_source: Qwen3.5-0.8B 真实 profile
    qwen35_0_8b_profile:
      hidden: 1024
      intermediate: 3584
      num_layers: 24
      query_heads: 8
      kv_heads: 2
      head_dim: 256
      rotary_dim: 64
      linear_key_heads: 16
      linear_value_heads: 16
      linear_key_head_dim: 128
      linear_value_head_dim: 128
      conv_kernel: 4
      conv_channels: 6144          # 2*16*128 + 16*128
      vocab: 248320
      full_attention_indices: [3, 7, 11, 15, 19, 23]
      gdr_layer_count: 18
      rms_norm_eps: 1.0e-6
      source: python/pypto/portable/qwen35.py:47-73
    cases:
      matmul:
        impl: [python/pypto/backends/cpu/runtime.py:881, python/pypto/backends/cpu/vector/runtime.py:966]
        native: [python/pypto/compiler/targets/cpu_avx2.py:303, python/pypto/compiler/targets/cpu_avx2.py:325]
        ranks: [2, 3, 4]
        batch_mode: exact_batch
        m_n_k: [1, 128, 512, 1024, 3584, 4096]
        batch: [1, 8, 16]
        dtypes: [bf16, float32]
      elementwise:
        impl: [python/pypto/backends/cpu/runtime.py:717, python/pypto/backends/cpu/runtime.py:743]
        ops: [add, sub, mul, div, neg]
        elements: [4096, 65536, 1048576, 4194304]
        broadcast: [scalar, shape]
      reduction:
        impl: [python/pypto/backends/cpu/runtime.py:824]
        ops: [reduce_sum, reduce_max, reduce_mean]
        axes: [last, middle, all]
        shapes: [[1, 1024, 1024], [1, 4096, 256]]
      softmax:
        impl: [python/pypto/portable/qwen35.py:889]
        shapes: [[1, 8, 1, 4096], [1, 8, 128, 4096]]
      conv1d:
        impl: [python/pypto/portable/qwen35.py:2793, python/pypto/portable/qwen35.py:2721, python/pypto/portable/qwen35.py:2804]
        t: [1, 128, 512]
      gdr_recurrent_step:
        impl: [python/pypto/portable/qwen35.py:3265, python/pypto/portable/qwen35.py:3558]
        ops_per_step: 21        # builder.op 调用数，无内部分支
        state_shape: [1, 16, 128, 128]
        state_dtype: float32
      layout_indexing:
        impl: [python/pypto/backends/cpu/runtime.py:509, python/pypto/backends/cpu/runtime.py:623, python/pypto/backends/cpu/runtime.py:750, python/pypto/backends/cpu/runtime.py:775]
        ops: [reshape, transpose, slice, split, concat, broadcast, gather, where, cast]
        shape_source: T=1/past=4096 图直方图众数
      math:
        impl: [python/pypto/backends/cpu/runtime.py:710, python/pypto/backends/cpu/runtime.py:671]
        ops: [exp, rsqrt, sigmoid, silu, softplus]
        elements: [4096, 65536, 1048576]

  L1_model:
    description: Qwen3.5-0.8B 文本 prefill / decode
    weights_loaded: false
    prefill:
      candidates: [16, 128, 512]
      recommended_first_round: [16, 128]
      later: [1024, 4096, 32768]
      source: configs/model_targets.yaml:14-15
    decode:
      t: 1
      past: [0, 128, 512, 4096]
    mandatory_declarations:
      execution_model: op_by_op_dispatch   # 当前唯一可取值；fused 尚不存在
      dispatch_count: 4550                 # graph v3 (T=1/past=4096)；v2 为 4532
      dispatch_seconds: <float>
      dispatch_floor_seconds: <float>
      dispatch_dominated: <bool>           # wall_seconds < 2 * dispatch_floor_seconds
    evidence_of_current_execution_model:
      cpu_scalar: python/pypto/backends/cpu/runtime.py:133-134
      cpu_vector_plan: python/pypto/backends/cpu/vector/runtime.py:462
      cpu_native_avx: python/pypto/backends/cpu/x86/avx2.py:11
      cuda: python/pypto/compiler/targets/cuda.py:919-930, python/pypto/backends/cuda/runtime.py:410
    gating_default: UNGATED   # 直到 dispatch_seconds 与 kernel event 计时落地

  L2_compile:
    description: CoreProgram → target IR → artifact
    separate_metrics: [lower_seconds, compile_seconds, artifact_bytes]
    cache_state_enum: [cold, warm, not_implemented]
    cache_state_current: not_implemented   # python/pypto/compiler/cache.py:16-33 仅内存
    points:
      lower:
        api: compiler.lower(program, target)
        existing_measurement:
          target: amd-igpu-gfx1036
          profile: {batch: 1, steps: 1, past_length: 4096}
          lower_seconds: 1.929875544999959
          max_rss_mib: 95.3828125
          llvm_ir_bytes: 10510232
          source: ../worktrees/_meta/pypto-x/integration-w5-hip-gfx1036-static-c3-final/qwen35-full-lower.json
      compile:
        api: compiler.compile(target_ir, options)
        note: AVX2/AVX-512 会真正调 clang；CUDA 仅渲染 PTX，无 ptxas
        avx_compile_command: "clang -shared -fPIC -O2 -std=c99 -mavx2 [-mfma] <src> -lm -o <out>"
        avx_compile_command_source: python/pypto/compiler/targets/cpu_avx2.py:695-698
        avx_compile_size_independent: true   # _NATIVE_SOURCE 是固定通用 kernel 库
      artifact_size:
        fields: [llvm_ir_bytes, ptx_bytes, shared_object_bytes, artifact_payload_bytes]

# ---------------------------------------------------------------------------
# 2. 指标与统计
# ---------------------------------------------------------------------------
metrics:
  wall_seconds: {unit: s, required: true}
  kernel_seconds: {unit: s, required: true, nullable: true, note: "CUDA 已由 cuEvent 提供 raw 值（2026-09-11 起）；null 仅用于驱动无 event API 的降级情形，并必须同时写 timing_error"}
  kernel_seconds_corrected: {unit: s, required: false, note: "CUDA on WSL2：raw × event_timer_rate；平台速率偏移校正后的估计值，不得替代 raw"}
  event_timer_rate: {unit: ratio, required: false, note: "run 内实测 host_wall/cuEvent_span（kernel-free record→sleep→record）；CUDA/WSL2 约 1.04–1.10"}
  event_timer_rate_spread_pct: {unit: percent, required: false, note: "标定窗口内 rate 离散度；门禁要求 ≤3"}
  platform_flags: {unit: list, required: false, note: "如 [wsl2_cuevent_rate_offset]；与 raw_wall_agreement=false 同条件触发"}
  raw_wall_agreement: {unit: bool, required: false, note: "仅表示本 run raw event-vs-wall 相对差 ≤5%，不构成平台无偏结论"}
  dispatch_seconds: {unit: s, required_for: [L0_op, L1_model]}
  tokens_per_second: {unit: tok/s, required_for: [L1_model]}
  prefill_tokens_per_second: {unit: tok/s, required_for: [L1_model]}
  ops_per_second: {unit: op/s, required_for: [L1_model]}
  gflops: {unit: GFLOP/s, required_for: [L0_op]}
  peak_rss_mib: {unit: MiB, required: true}
  peak_device_memory_mib: {unit: MiB, required_for_gpu: true}
  lower_seconds: {unit: s, required_for: [L2_compile]}
  compile_seconds: {unit: s, required_for: [L2_compile]}
  artifact_bytes: {unit: B, required_for: [L2_compile]}

flop_accounting:
  rule: 每个 case 必须原样写入 flop_accounting 公式字符串，禁止口算
  repository_has_flop_counter: false    # 全仓 grep -i flops 在 python/pypto 与 ut/pypto_x 下 0 命中
  formulas:
    matmul: "2 * B * M * N * K"                      # bf16 与 fp32 同为 2 FLOP/MAC
    matmul_bf16_note: 禁止给 bf16 记 1 FLOP/MAC
    conv1d_causal: "2 * T * C_out * C_in * K"
    elementwise_binary: "1 * N_out"
    elementwise_unary_neg: 0
    cast: 0                                          # 单独报 cast_bytes_per_second
    reduce_sum_mean: "(N_in / N_out - 1) * N_out"
    reduce_max: 0                                    # 单独报 compare_ops_per_second
    transcendental: 0                                # exp/sigmoid/silu/softplus/rsqrt
    transcendental_note: 单独报 transcendental_ops_per_second，禁止算成 FLOP
    softmax: "3 * N"
    embedding_gather_iota_where: 0                   # 报 bytes_per_second
  derived:
    gflops_scope: [kernel_only, end_to_end]
    arithmetic_intensity_flop_per_byte: <float>
    memory_bound: <bool>                             # AI < 10 FLOP/byte → true
    memory_bound_rule: memory_bound=true 时禁止与峰值算力对比、禁止写"达到峰值 X%"

statistics:
  clock_warmup_seconds: 2.0
  warmup_iterations: 5
  warmup_acceptance: "|last_warmup - min(first 5 measured)| / min(first 5 measured) < 0.05"
  warmup_max_rounds: 3
  measured_iterations:
    L0_op: 51
    L1_model: 21
    L2_compile: 11
  minimum_measured_iterations: 11
  quantities: [min, median, p95, max, stdev, cv, p95_over_median]
  p95_method: nearest_rank
  p95_interpolation: false
  outlier_policy: mark_only_never_drop
  outlier_rule: "|x - median| > max(3 * 1.4826 * MAD, floor); floor = max(1us, 0.02 * median)"
  outlier_rule_amended_2026_09_11: err_0004_wsl2_mad_floor
  outlier_ratio_invalid_threshold: 0.10
  variance_limits:
    local_kvm_no_cpufreq: {cv_max: 0.05, p95_over_median_max: 1.25}
    nvidia_5080_clock_asserted: {cv_max: 0.03, p95_over_median_max: 1.15}
    nvidia_5080_clock_unlocked: {cv_max: 0.05, p95_over_median_max: 1.25}
    kunpeng_920b: not_applicable
  verdict_enum: [VALID, INVALID_VARIANCE, INVALID_WARMUP, ENV_NOISY, INVALID_CLOCK, UNSTABLE]

# ---------------------------------------------------------------------------
# 3. 环境控制
# ---------------------------------------------------------------------------
environment:
  local:
    runner: scripts/resource/run_local_heavy.sh
    lock: local
    lock_root: /home/chiro/projects/.resource-locks
    busy_exit_codes_must_wait: [75, 69]
    supervisor_abort_exit_code: 70
    fixed_max_cpus: 6
    cpu_affinity_must_be_recorded: true
    threads: 6
    threads_env_forced_by_monitor:
      source: scripts/resource/monitor_local_heavy.py:201-208
      names: [OMP_NUM_THREADS, OPENBLAS_NUM_THREADS, MKL_NUM_THREADS, NUMEXPR_NUM_THREADS,
              RAYON_NUM_THREADS, MAX_JOBS, CMAKE_BUILD_PARALLEL_LEVEL, PYTEST_XDIST_AUTO_NUM_WORKERS]
    resource_log_required: true
    resource_log_schema:
      events: [start, sample, finish]
      fields: [available_mib, cpu_affinity, max_cpus, safety_floor_mib, child_rss_mib,
               child_cpu_capacity_percent, child_processes, load1, runnable,
               cpu_psi_avg10, memory_psi_avg10, system_processes]
    noise_gate:
      max_load1_below_online_cpus: true
      max_cpu_psi_avg10: 25
      min_available_mib: 4096
      fail_verdict: ENV_NOISY
    measured_facts_2026_09_10:
      cpu_model: "AMD Eng Sample: 100-000000956-50_Y"
      nproc_online: 12
      numa_nodes: 1
      l3_cache: "192 MiB (12 instances)"
      virtualization: kvm
      cpufreq_available: false
      cpufreq_path_absent: /sys/devices/system/cpu/cpu0/cpufreq/
      governor: null
      turbo_controllable: false
      mem_total_mib: 30032
      isa_flags: [avx2, avx512f, avx512bw, avx512vl, avx512_bf16, fma, f16c]
      isa_flags_absent: [amx_bf16, amx_tile]
      toolchain: {clang: "22.1.8", gcc: "16.1.1", cmake: "4.4.2", python: "3.12.10"}
    frequency_control: unavailable_kvm_guest
    absolute_thresholds_allowed_here: false

  nvidia_5080_wsl2:
    host: 192.168.101.5
    ssh_command: 'ssh 192.168.101.5 ''wsl.exe -e bash -lc "<cmd>"'''
    gamepc_lock_required: false        # docs/LOCAL_RESOURCE_POLICY.zh-CN.md:94
    pre_post_queries_required:
      - "nvidia-smi --query-gpu=clocks.sm,clocks.max.sm,clocks.mem,clocks.max.memory,power.draw,power.limit,temperature.gpu,utilization.gpu,memory.used,memory.total,persistence_mode,compute_mode --format=csv"
      - "nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv"
      - "nvidia-smi -q -d PERFORMANCE"
    clock_assertion:
      rule: "clocks_sm_mhz >= 0.9 * clocks_max_sm_mhz"
      enforce: record_and_assert         # WSL 下 -lgc 锁定不可用
      fail_verdict: INVALID_CLOCK
    compute_process_cleanliness: both_before_and_after_must_be_empty
    measured_facts_2026_09_10:
      gpu: "NVIDIA GeForce RTX 5080"
      memory_total_mib: 16303
      compute_capability: "12.0"
      driver_kmd: "616.92"
      cuda_umd: "13.4"
      doc_recorded_driver: "610.62"      # docs/RESOURCE_MATRIX.zh-CN.md:40 —— 已漂移
      doc_recorded_cuda_umd: "13.3"
      clocks_sm_idle_mhz: 427
      clocks_max_sm_mhz: 3090
      clock_gap_factor: 7.24
      power_limit_w: 365.00
      power_default_limit_w: 365.00
      persistence_mode: Enabled
      compute_mode: Default
      libcublas_present: false
      libcudart_present: false
      nvcc_present: false
      clocks_event_reasons: {Reliability: Active}
    driver_change_rule: 不同 driver_kmd 的证据之间 comparable=false

  kunpeng_920b_ecs:
    role: native_functional_reference_only
    vcpu: 2
    virtualization: kvm
    gate_eligible: false
    may_not_enter: [baseline.ratio, thresholds]
    sources:
      - docs/RESOURCE_MATRIX.zh-CN.md:12
      - configs/development_lock.yaml:310

  qemu_aarch64:
    role: functional_only
    numbers_rejected: true
    evidence_class: functional_only
    detection: QEMU_CPU env present or host == qemu-*
    sources: [docs/RESOURCE_MATRIX.zh-CN.md:94-105]

  amd_igpu_gfx1036:
    role: static_codegen_only
    runtime_status: BLOCKED_DEVICE
    allowed_levels: [L2_compile]
    kernel_seconds: null
    tokens_per_second: null
    native_execution_claim: false
    sources: [docs/RESOURCE_MATRIX.zh-CN.md:167-171, docs/RESOURCE_MATRIX.zh-CN.md:179]

# ---------------------------------------------------------------------------
# 4. 基线
# ---------------------------------------------------------------------------
baseline:
  host_fingerprint_inputs:
    - cpu_model
    - nproc_online
    - cpu_affinity_list
    - virtualization
    - cpufreq_available
    - gpu_name
    - gpu_driver_version
    - mem_total_mib
  rule: host_fingerprint 不同的两条证据之间禁止计算 ratio

  tiers:
    T0_external_blas:
      name: scipy-openblas
      available: true
      version: "0.3.33.112.0"
      bundled_with: "numpy 2.5.1"
      library_path: runtime_detected   # 运行时用 numpy.show_config()/find_library 探测；
                                       # 不要写死本机 .so 路径（本机示例：<env>/lib/python3.12/site-packages/numpy.libs/libscipy_openblas64_-*.so）
      thread_setter: scipy_openblas_set_num_threads64_
      thread_getter: scipy_openblas_get_num_threads64_
      threads_must_equal: 6
      threads_verified_required: true
      shape_must_match_exactly: true
      forbidden:
        - system_libblas_netlib_reference       # /usr/lib/libblas.so.3.12.0，nm -D | grep -c openblas == 0
        - np.einsum_python_fallback
        - pure_python_reference
      ratio_usable: true
    T1_vendor_gpu_lib:
      names: [cublas, hipblas]
      available: false
      availability: MISSING
      evidence: "ldconfig -p | grep -i cublas → 空；/usr/lib/wsl/lib/ 无 libcublas*"
      requires_user_authorization_to_enable: install_cuda_toolkit
      ratio_usable: true
    T2_self_version_ratio:
      description: PyPTO-X 与自身上一冻结 SHA 比较
      constraints: 同 host fingerprint、同 affinity、同日
      absolute_values_comparable: false
      ratio_usable: false
      forbids: [cross_backend_ranking, peak_percentage_claims, relative_gate]
    T3_absolute_only:
      description: 无基线，只报绝对数
      ratio_usable: false
      gate: UNGATED

  custom_baseline_allowed: true
  custom_baseline_requirements:
    - 与 PyPTO-X 实现路径不同源
    - objdump -d 证明生成目标 ISA 指令（YMM/ZMM 计数 > 0）
    - tier 仍标 T2_self_version_ratio（自研，非第三方）

# ---------------------------------------------------------------------------
# 5. 门槛阶梯
# ---------------------------------------------------------------------------
gates:
  G1_correctness:
    status: already_frozen
    preconditions: []
    pass_criteria:
      - validation.json status == PASS
      - source_clean == true
      - actual_head == expected_head
      - full_pypto_x 汇总 PASS
    fields: [schema_version, task, branch, worktree, expected_head, actual_head, source_clean, scope]
    approver: delegated_verification_agent
    rollback: 实现 agent 修复后从新 integration HEAD 重开验收 worktree

  G2_stability:
    status: new_in_this_protocol
    preconditions: [G1_correctness PASS]
    pass_criteria:
      rounds: 3
      iterations_per_round: 21
      same_host: true
      same_cpu_affinity: true
      per_round: "cv <= variance_limits 表值 and p95_over_median <= 表值"
      median_spread_ratio_max: 0.10
    fields: ["stability.rounds", "stability.per_round[]", "stability.median_spread_ratio", "stability.verdict"]
    approver: implementing_agent_self_attest + verification_agent_spot_rerun
    rollback: 整轮作废并重跑；禁止"多跑几次取最好"

  G3_relative:
    status: new_in_this_protocol
    preconditions:
      - G1 PASS
      - G2 PASS
      - baseline.tier in [T0_external_blas, T1_vendor_gpu_lib]
      - dispatch_dominated == false
    ratio_definition: "pypto_x_median / baseline_median"
    direction: lower_is_better
    statistic: median
    candidate_formula: "candidate_ratio = median(measured_ratio over 3 rounds)"
    frozen_formula: "frozen_ratio = max(candidate_ratio, 1.0) * 1.10"
    threshold_key: [op, shape_tuple, dtype, isa, cpu_affinity]
    global_single_threshold_forbidden: true
    fields: [baseline.tier, baseline.name, baseline.availability, baseline.median,
             baseline.ratio, gate.relative, "ratios[]"]
    approver: user                     # 验收 agent 出候选值，用户批准后写 lock 文件
    rollback: REGRESSION_SUSPECT → 一次复测 → 开优化 task；禁止直接上调阈值

  G4_absolute:
    status: disabled_in_this_phase
    preconditions:
      - 至少一个后端 execution_model == fused
      - baseline.tier in [T0_external_blas, T1_vendor_gpu_lib]
      - G3 连续 2 个冻结版本无回归
    pass_criteria: 本阶段不定义
    config_untouched: configs/model_targets.yaml:84
    approver: user

  rollback_matrix:
    - symptom: "cv > 上限 或 p95/median > 上限"
      gate: G2
      action: 整轮作废、重跑；连续 3 轮失败上报环境问题
      decider: implementing_agent
    - symptom: "clocks.sm < 0.9 * clocks.max.sm"
      gate: G2
      action: 延长 warmup 重跑；仍失败则记 clock_unlocked=true 并降级 T3
      decider: implementing_agent
    - symptom: "max(load1) >= online_cpus 或 PSI >= 25"
      gate: G2
      action: 换时段重跑；不得删除慢轮次
      decider: implementing_agent
    - symptom: "resource-lock 返回 75 或 69"
      gate: null
      action: 等待；禁止绕过、抢占、裸跑
      decider: coordinator
    - symptom: "supervisor 返回 70"
      gate: null
      action: 该轮作废；缩规模或换时段
      decider: implementing_agent
    - symptom: dispatch_dominated == true
      gate: G3
      action: 不进比例门；先做 dispatch 优化或补 event 计时
      decider: "implementing_agent + user"
    - symptom: "ratio > frozen_ratio"
      gate: G3
      action: REGRESSION_SUSPECT → 一次复测 → 开优化 task
      decider: implementing_agent
    - symptom: host_fingerprint 变化
      gate: G3
      action: ratio 强制作废，重测基线
      decider: implementing_agent

# ---------------------------------------------------------------------------
# 6. 证据 schema
# ---------------------------------------------------------------------------
evidence_schema:
  schema_version: 1
  artifact_kind: pypto-x.perf-evidence
  citation_rules:
    # 本任务实测：控制仓由其他 agent 并发写入，行号会漂移。
    #   configs/development_lock.yaml: known_limits: 1132 -> 1141 (文件 1143 -> 1152 行)
    #   AGENTS.md:                    ## Subagent 协议 37 -> 29 (62 -> 59 行)
    #   scripts/resource/run_local_heavy.sh: max_cpus 87-89 -> 76-80
    - 引用源码必须同时记录绝对路径 + anchor + 文件 sha256
    - 行号只作辅助，必须由 anchor 解析得出，不得手写
    - integration worktree 证据必须记录 pin 住的 commit SHA
    - 控制仓证据必须记录 control_repo.head
  required_top_level:
    - schema_version
    - artifact_kind
    - task
    - agent
    - timestamp_utc
    - git
    - host
    - resource_lock
    - environment_freeze
    - measurement
    - statistics
    - metrics
    - baseline
    - gate
  git: {repository: upstream/pypto, head: <sha>, branch: <str>, dirty: false}
  host:
    class_enum: [local, nvidia-5080-wsl2, amd-igpu-gfx1036, kunpeng-920b-ecs, qemu-aarch64]
    fields: [fingerprint, uname, nproc_online, cpu_affinity, cpu_model, virtualization,
             cpufreq_available, governor, frequency_control, mem_total_mib,
             mem_available_min_mib, load1_max, cpu_psi_avg10_max, gpu]
  resource_lock:
    fields: [lock, runner, task, monitor_log, cpu_affinity, max_cpus]
  environment_freeze:
    fields: [toolchain, threads, blas, qwen_weights_loaded]
  measurement:
    fields: [level, execution_model, dispatch_count, dispatch_dominated,
             warmup_iterations, measured_iterations, clock_warmup_seconds]
  statistics:
    fields: [unit, min, median, p95, max, stdev, cv, p95_over_median,
             outliers_marked, outlier_ratio, verdict]
  metrics:
    fields: [wall_seconds_median, kernel_seconds_median, dispatch_seconds_median,
             tokens_per_second, ops_per_second, gflops, gflops_scope, flop_accounting,
             arithmetic_intensity_flop_per_byte, memory_bound,
             transcendental_ops_per_second, peak_rss_mib, peak_device_memory_mib]
  compile:
    fields: [lower_seconds, compile_seconds, artifact_bytes, cache_state]
  baseline:
    fields: [tier, name, availability, median, ratio, comparable, incomparable_reason]
  gate:
    fields: [correctness, stability, relative, absolute, eligible_for_threshold]
  storage_layout:
    root: ../worktrees/_meta/pypto-x/<task>/
    perf_evidence: perf-evidence/<case-key>.json
    resource_logs: ../worktrees/_meta/pypto-x/resource-usage/<task>/<UTC>.log
    summary: validation.json

# ---------------------------------------------------------------------------
# 7. 反模式检测
# ---------------------------------------------------------------------------
antipatterns:
  - id: 1
    name: QEMU_KVM_numbers_as_threshold
    detect: "host.virtualization == kvm and host.class in [qemu-aarch64, kunpeng-920b-ecs]"
    action: gate_eligible=false
  - id: 2
    name: cross_machine_comparison
    detect: "两条证据 host.fingerprint 不同却存在 baseline.ratio"
    action: reject_ratio
  - id: 3
    name: python_dispatch_counted_as_kernel_perf
    detect: "execution_model==op_by_op_dispatch and (dispatch_seconds missing or (dispatch_dominated and gflops_scope==kernel_only))"
    action: require_dispatch_floor; until then UNGATED
  - id: 4
    name: no_warmup
    detect: "warmup_iterations < 5 or verdict == INVALID_WARMUP"
    action: discard
  - id: 5
    name: single_measurement
    detect: "measured_iterations < 11"
    action: gate_eligible=false
  - id: 6
    name: bf16_fp32_flop_conflation
    detect: "flop_accounting missing or bf16 matmul uses 1*B*M*N*K"
    action: recompute with 2*B*M*N*K
  - id: 7
    name: static_lowering_as_runtime_perf
    detect: "native_execution_claim == false but kernel_seconds != null"
    action: restrict to L2 metrics
  - id: 8
    name: mixed_cpu_affinity_comparison
    detect: "两条证据 resource_lock.cpu_affinity 不同"
    action: reject_ratio
  - id: 9
    name: netlib_blas_as_baseline
    detect: "baseline.name == system-libblas and tier == T0_external_blas"
    action: demote_to_correctness_only
  - id: 10
    name: gpu_clock_state_ignored
    detect: "clocks_sm_mhz / clocks_max_sm_mhz < 0.9"
    action: INVALID_CLOCK
  - id: 11
    name: lower_time_as_compile_speed
    detect: "AVX 路径下把 lower_seconds 与 compile_seconds 混报"
    action: 分开报，各自单独门槛
  - id: 12
    name: ascend_st_perf_as_gate
    detect: "引用 python/tests/st/test_perf.py 的 baseline 字段断言作为性能门槛"
    action: 不作为依据（它断言字段一致性，且依赖 torch/torch_npu）
  - id: 13
    name: logits_only_no_state
    detect: "缺 per-layer / GDR state 误差报告"
    action: 属 G1 范围，引用 configs/model_targets.yaml:86-90
  - id: 14
    name: ignoring_swap_disabled_oom
    detect: "monitor 返回 70"
    action: 该轮作废，禁止降级裸跑
  - id: 15
    name: cross_driver_gpu_comparison
    detect: "gpu.driver_kmd 不同"
    action: comparable=false
  - id: 16
    name: unrolled_gdr_as_fused
    detect: "T>1 却声称融合"
    action: 标 unroll=true；source python/pypto/portable/qwen35.py:1854-1855

