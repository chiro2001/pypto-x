version: 1

primary_model:
  id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  architecture: Qwen3_5ForConditionalGeneration
  license: Apache-2.0
  weights_downloaded: false
  initial_scope: text-only
  vision_scope: deferred-not-in-current-mvp
  generation:
    strategy: greedy
    batch_sizes: [1, 2]
    prompt_lengths: [16, 128, 1024]
    later_prompt_lengths: [4096, 32768]
    decode_lengths: [16, 64]

precision_modes:
  - name: bf16
    weights: bf16
    activations: bf16
    sensitive_accumulation: fp32
  - name: w8a8-linear
    weights:
      dtype: int8
      signed: true
      symmetric: true
      zero_point: 0
      granularity: per-output-channel
      scale_dtype: fp32
    activations:
      dtype: int8
      signed: true
      symmetric: true
      zero_point: 0
      granularity: per-token-or-row
      scale_dtype: fp32
      quantization: dynamic-absmax
    accumulation: int32
    output: bf16
    floating_islands:
      - embedding-initially
      - norm
      - nonlinear
      - softmax
      - rope
      - attention-qk-pv-initially
      - kv-cache
      - gdr-recurrent-state
      - gdr-core-recurrence
      - residual-stream

explicitly_out_of_scope:
  - w8a16
  - w4a16
  - int4
  - fp8
  - w4a4
  - quantized-kv-cache
  - quantized-gdr-state
  - vision-encoder-in-initial-mvp
  - moe
  - distributed-inference

backend_order:
  - x86-avx2
  - x86-avx512
  - aarch64-sve256
  - nvidia-cuda
  - amd-hip

dense_shape_harness:
  models: [Qwen3.5-2B, Qwen3.5-4B, Qwen3.5-9B, Qwen3.5-27B]
  weights_required: false
  coverage:
    - gemm-shapes
    - linear-attention-heads
    - gdr-state-shapes
    - dynamic-tail
    - workspace

validation:
  compare_against: transformers-bf16-reference
  performance_threshold_policy: defer-until-first-runnable-backends
  required_reports:
    - per-op-error
    - per-layer-hidden-state-error
    - gdr-state-error
    - logits-error-and-cosine
    - top1-top5-agreement
    - greedy-first-divergence
    - perplexity-delta
    - peak-memory
    - compile-and-cache-time
    - prefill-latency
    - decode-latency
    - pypto-x-coverage
