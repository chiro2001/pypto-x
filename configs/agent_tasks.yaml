version: 5
project_name: PyPTO-X
project_full_name: PyPTO Cross-Architecture
python_api_compatibility: [pypto, pypto_pro]
frontend_strategy: tensor-first-core-ir-with-pro-ascend-expert-and-portable-subset
model_target_config: configs/model_targets.yaml

# This file deliberately has no model/model_name field.
# The agent launcher must use its default model and must not download model weights.
protocol:
  started_at_required: true
  smoke_runs_per_agent: 1
  smoke_script: scripts/smoke/pypto_pro_smoke.sh
  wait_timeout_seconds: 3600
  polling: false
  model_argument: omitted
base:
  repository: upstream/pypto
  # Exact edge snapshot. Promote to stable only after CANN-release compatibility tests.
  ref: 34475e0d83c6cdc7deac2082b1b4fa81b3beb6ad
  release_anchor: v9.2.0-beta.2
  release_anchor_commit: 1cce5f84284af6da4e64f217384d579ba3cd4df6
  lock_policy: release-family-plus-exact-commit
  promotion_status: pending
  integration_branch: port/pypto-x-integration
  worktree_root: ../worktrees/pypto-x

waves:
  - id: W0
    tasks:
      - name: architecture
        branch: work/architecture
        resource: local
        paths: [docs, configs]
        depends_on: []
  - id: W1
    tasks:
      - name: target-abi
        branch: work/target-abi
        resource: local
        paths:
          - python/pypto/target
          - python/pypto/compiler
          - python/pypto/abi
          - python/tests/ut/pypto_x/test_target_abi.py
        depends_on: [architecture]
      - name: core-ir
        branch: work/core-ir
        resource: local
        paths:
          - python/pypto/core_ir
          - python/pypto/frontend/core_export.py
          - python/tests/ut/pypto_x/test_core_ir.py
        depends_on: [architecture]
      - name: verification
        branch: work/verification
        resource: local
        paths:
          - python/tests/ut/pypto_x/harness
          - python/tests/ut/pypto_x/snapshots
          - tools/pypto_x
        depends_on: [architecture]
  - id: W2
    tasks:
      - name: tensor-core-bridge
        branch: work/tensor-core-bridge
        resource: local
        paths:
          - python/pypto/frontend/core_export.py
          - python/pypto/frontend/pil_core_bridge.py
          - python/tests/ut/pypto_x/test_tensor_core_bridge.py
        depends_on: [core-ir, verification]
      - name: ascend-adapter
        branch: work/ascend-adapter
        resource: ascend-or-simulator
        paths:
          - python/pypto/backends/ascend
          - python/pypto/compiler/targets/ascend.py
          - python/tests/ut/pypto_x/test_ascend_adapter.py
        depends_on: [target-abi, core-ir, verification]
      - name: cpu-scalar
        branch: work/cpu-scalar
        resource: local
        paths:
          - python/pypto/lowering/cpu
          - python/pypto/compiler/targets/cpu.py
          - python/pypto/backends/cpu
          - python/tests/ut/pypto_x/test_cpu_scalar.py
        depends_on: [target-abi, core-ir, verification]
  - id: W3
    tasks:
      - name: cpu-vector-common
        branch: work/cpu-vector-common
        resource: local
        paths: [python/pypto/lowering/cpu/vector, python/pypto/backends/cpu/vector]
        depends_on: [cpu-scalar]
      - name: cpu-avx2
        branch: work/cpu-avx2
        resource: local
        paths: [python/pypto/lowering/cpu/x86/avx2, python/pypto/backends/cpu/x86]
        depends_on: [cpu-vector-common]
      - name: cpu-avx512
        branch: work/cpu-avx512
        resource: local
        paths: [python/pypto/lowering/cpu/x86/avx512, python/pypto/backends/cpu/x86]
        depends_on: [cpu-avx2]
  - id: W4
    tasks:
      - name: cpu-sve256
        branch: work/cpu-sve256
        resource: qemu-then-kunpeng
        paths: [python/pypto/lowering/cpu/aarch64/sve, python/pypto/backends/cpu/aarch64]
        depends_on: [cpu-avx512]
      - name: gpu-common
        branch: work/gpu-common
        resource: nvidia-5080
        paths:
          - python/pypto/lowering/gpu
          - python/pypto/backends/gpu
          - python/pypto/abi/gpu.py
        depends_on: [target-abi, core-ir, cpu-sve256]
      - name: cuda
        branch: work/cuda
        resource: nvidia-5080
        paths: [python/pypto/compiler/targets/cuda.py, python/pypto/backends/cuda]
        depends_on: [gpu-common]
  - id: W5
    tasks:
      - name: hip
        branch: work/hip
        resource: amd-6750gre
        paths: [python/pypto/compiler/targets/hip.py, python/pypto/backends/hip]
        depends_on: [gpu-common, cuda]
  - id: W6
    tasks:
      - name: qwen35-08b-model
        branch: work/qwen35-08b-model
        repository: upstream/pypto-gym
        resource: target-dependent
        paths:
          - src/pypto_gym/transformers/qwen3_5_0_8b
          - modeling/transformers/qwen3_5_0_8b
          - tests/models/qwen3_5_0_8b
        precision_config: configs/model_targets.yaml
        depends_on: [cpu-avx512, verification, tensor-core-bridge]
