  - id: W0
    tasks:
      - name: architecture
        branch: work/architecture
        resource: local
        paths: [docs, configs]
        depends_on: []
  - id: W1
    tasks:
      - name: target-abi
        branch: work/target-abi
        resource: local
        paths:
          - python/pypto/target
          - python/pypto/compiler
          - python/pypto/abi
          - python/tests/ut/pypto_x/test_target_abi.py
        depends_on: [architecture]
      - name: core-ir
        branch: work/core-ir
        resource: local
        paths:
          - python/pypto/core_ir
          - python/pypto/frontend/core_export.py
          - python/tests/ut/pypto_x/test_core_ir.py
        depends_on: [architecture]
      - name: verification
        branch: work/verification
        resource: local
        paths:
          - python/tests/ut/pypto_x/harness
          - python/tests/ut/pypto_x/snapshots
          - tools/pypto_x
